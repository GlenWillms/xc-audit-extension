<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">F5 XC Audit <span id="version" style="font-size:0.7em;opacity:0.6"></span></div>

    <div id="status" class="status-row">
      <span id="statusIcon" class="icon"></span>
      <span id="statusText">Checking...</span>
    </div>

    <div id="results" class="results" style="display:none">
      <div id="policyResult" class="result-item" style="display:none"></div>
      <div id="lbSummary" class="result-item"></div>
      <div id="lbDetails"></div>
    </div>

    <div id="notOnPage" class="info" style="display:none">
      Navigate to an F5 XC HTTP Load Balancer list page to see audit results.
    </div>

    <div class="actions">
      <button id="reAudit" class="btn">Re-Audit</button>
      <button id="openReport" class="btn btn-secondary">Report</button>
      <button id="openOptions" class="btn btn-secondary">Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
